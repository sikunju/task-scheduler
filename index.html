<style>
/* Layout: macOS-style app window (title bar + vibrancy sidebar + content) floating on a soft desktop wallpaper */
:root{
  --desk-a:#cfe3f3; --desk-b:#f3e3cf; --desk-c:#b9d6e8;
  --win:#ffffff; --side:rgba(236,239,243,.82); --bar:rgba(246,247,249,.9);
  --card:#ffffff; --sunk:#f3f4f7; --hover:rgba(0,0,0,.05); --sel:rgba(10,122,255,.12);
  --line:rgba(0,0,0,.09); --line2:rgba(0,0,0,.16);
  --fg:#1d1d1f; --fg2:#5b5d63; --fg3:#8a8c93;
  --accent:#0a7aff; --accent-fg:#ffffff;
  --ok:#28a745; --warn:#d98a00; --bad:#e5383b; --info:#0a7aff;
  --ok-bg:rgba(40,167,69,.13); --warn-bg:rgba(217,138,0,.14); --bad-bg:rgba(229,56,59,.12); --info-bg:rgba(10,122,255,.12);
  --shadow:0 30px 80px rgba(20,30,50,.28),0 0 0 .5px rgba(0,0,0,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk-a:#1b2a3a; --desk-b:#2b2230; --desk-c:#13202c;
  --win:#1e1e20; --side:rgba(40,40,44,.84); --bar:rgba(44,44,48,.92);
  --card:#2a2a2d; --sunk:#252528; --hover:rgba(255,255,255,.06); --sel:rgba(10,132,255,.24);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.18);
  --fg:#f2f2f4; --fg2:#b4b5ba; --fg3:#85868c;
  --accent:#0a84ff; --accent-fg:#ffffff;
  --ok:#32d74b; --warn:#ffb340; --bad:#ff5f57; --info:#64a8ff;
  --ok-bg:rgba(50,215,75,.16); --warn-bg:rgba(255,179,64,.16); --bad-bg:rgba(255,95,87,.16); --info-bg:rgba(10,132,255,.22);
  --shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.14);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --desk-a:#1b2a3a; --desk-b:#2b2230; --desk-c:#13202c;
  --win:#1e1e20; --side:rgba(40,40,44,.84); --bar:rgba(44,44,48,.92);
  --card:#2a2a2d; --sunk:#252528; --hover:rgba(255,255,255,.06); --sel:rgba(10,132,255,.24);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.18);
  --fg:#f2f2f4; --fg2:#b4b5ba; --fg3:#85868c;
  --accent:#0a84ff; --accent-fg:#ffffff;
  --ok:#32d74b; --warn:#ffb340; --bad:#ff5f57; --info:#64a8ff;
  --ok-bg:rgba(50,215,75,.16); --warn-bg:rgba(255,179,64,.16); --bad-bg:rgba(255,95,87,.16); --info-bg:rgba(10,132,255,.22);
  --shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.14);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{background:var(--desk-a);background-image:radial-gradient(1200px 700px at 10% 0%,var(--desk-b),transparent 60%),radial-gradient(900px 600px at 100% 100%,var(--desk-c),transparent 60%);
  color:var(--fg);font:13.5px/1.45 var(--font);-webkit-font-smoothing:antialiased;display:flex;
  padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
@media (min-width:900px){body{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px;border-radius:6px}

.win{flex:1;min-width:0;max-width:1380px;margin:0 auto;background:var(--win);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.97);opacity:.4}}
.titlebar{height:52px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--bar);border-bottom:1px solid var(--line);backdrop-filter:blur(20px)}
.lights{display:flex;gap:8px;flex:none}
.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.logo{display:inline-block;flex:none;line-height:0}.logo svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.18))}
#tbLogo{display:flex;flex:none}
.welcome{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:26px 22px 4px}
.welcome h2{margin:10px 0 0;font:700 22px var(--font-d);letter-spacing:-.01em}
.welcome p{margin:0;color:var(--fg2);max-width:40ch}
.tb-title{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.tb-title small{font-weight:400;color:var(--fg3);margin-left:6px}
.tb-tools{display:flex;gap:8px;align-items:center;flex:none}
.syncchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2);padding:3px 9px;border-radius:999px;background:var(--hover);white-space:nowrap}
.syncchip i,.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--warn)}
.syncchip.ok i,.dot.ok{background:var(--ok)}.syncchip.bad i,.dot.bad{background:var(--bad)}
.syncchip.warn i{animation:blink 1.6s ease-in-out infinite}@keyframes blink{50%{opacity:.35}}
#syncStatus{display:flex;align-items:center;gap:8px}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--fg2);font-size:13px}
ol.steps b{color:var(--fg)}
.mebtn{display:flex;align-items:center;gap:7px;border:0;background:transparent;border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;color:var(--fg)}
.mebtn:hover{background:var(--hover)}
.mebtn .av{width:24px;height:24px;font-size:10px}
.whol{display:flex;flex-direction:column;gap:6px}
.whol h5{margin:8px 2px 2px;font-size:11.5px;color:var(--fg3);font-weight:600}
.search{display:flex;align-items:center;gap:6px;background:var(--hover);border-radius:7px;padding:4px 8px;width:220px;color:var(--fg3)}
.search input{border:0;background:transparent;outline:0;width:100%;color:var(--fg);font-size:13px}
.search svg{flex:none}

.body{flex:1;display:flex;min-height:0}
.side{width:216px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto;backdrop-filter:blur(30px)}
.side h6{margin:14px 10px 4px;font-size:11px;font-weight:600;color:var(--fg3);letter-spacing:.02em}
.side h6:first-child{margin-top:2px}
.nav{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:7px;border:0;background:transparent;text-align:left;font-size:13.5px;color:var(--fg)}
.nav svg{color:var(--accent);flex:none}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--sel)}
.nav .ct{margin-left:auto;font-size:12px;color:var(--fg3);font-variant-numeric:tabular-nums}
.side .grow{flex:1}
.side .credit{font-size:11.5px;color:var(--fg3);padding:10px;line-height:1.5}
.side .credit a{color:var(--accent);text-decoration:none}

main{flex:1;min-width:0;overflow:auto;padding:26px 30px 40px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font:700 26px/1.15 var(--font-d);margin:0;letter-spacing:-.015em;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--fg2)}
.head .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:7px;padding:5px 12px;background:var(--card);box-shadow:0 0 0 .5px var(--line2),0 1px 1.5px rgba(0,0,0,.08);font-size:13px;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--accent-fg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--accent)}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:3px 9px;font-size:12px}
.ibtn{border:0;background:transparent;border-radius:6px;padding:5px;color:var(--fg2);display:inline-flex}
.ibtn:hover{background:var(--hover);color:var(--fg)}
.ibtn.bad:hover{color:var(--bad)}

.seg{display:inline-flex;background:var(--hover);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:3px 12px;font-size:12.5px;color:var(--fg2)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.14),0 0 0 .5px var(--line)}
select.sel{border:0;border-radius:7px;background:var(--card);box-shadow:0 0 0 .5px var(--line2),0 1px 1.5px rgba(0,0,0,.08);padding:4px 8px;font-size:13px}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--info-bg);border-radius:10px;padding:10px 14px;margin-bottom:18px;color:var(--fg)}
.banner p{margin:0;flex:1;min-width:220px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--sunk);border-radius:12px;padding:14px 16px;border:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.stat:hover{background:var(--hover)}
.stat b{font:700 28px/1.1 var(--font-d);font-variant-numeric:tabular-nums}
.stat span{color:var(--fg2);font-size:12.5px;display:flex;align-items:center;gap:6px}
.stat span i{width:8px;height:8px;border-radius:50%;display:inline-block}

.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px}
@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border-radius:12px;box-shadow:0 0 0 .5px var(--line2);overflow:hidden;min-width:0}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel>header h2{font-size:14px;margin:0;font-weight:600}
.panel>header small{color:var(--fg3)}
.empty{padding:28px 16px;text-align:center;color:var(--fg3)}

.drop{margin:14px;border:2px dashed var(--line2);border-radius:12px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;transition:.15s}
.drop.hot{border-color:var(--accent);background:var(--sel)}
.drop .big{width:46px;height:46px;border-radius:12px;background:var(--info-bg);color:var(--accent);display:grid;place-items:center}
.drop strong{font-size:14px}
.drop p{margin:0;color:var(--fg2);max-width:42ch}
.drop .row-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:4px}

/* task rows */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);background:transparent;display:grid;place-items:center;padding:0;color:#fff}
.check:hover{border-color:var(--ok)}
.row.done .check{background:var(--ok);border-color:var(--ok)}
.row.done .rt{text-decoration:line-through;color:var(--fg3)}
.rt{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.rm{font-size:12px;color:var(--fg3);display:flex;gap:10px;flex-wrap:wrap;margin-top:1px}
.rm .over{color:var(--bad);font-weight:500}
.rm .soon{color:var(--warn)}
.rm span{display:inline-flex;align-items:center;gap:4px}
.pri{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.pri.high{color:var(--bad)}.pri.low{color:var(--fg3)}
.acts{display:flex;gap:2px}
select.pill{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:500;cursor:pointer;text-align:center}
.s-pending{background:var(--warn-bg);color:var(--warn)}
.s-working{background:var(--info-bg);color:var(--info)}
.s-done{background:var(--ok-bg);color:var(--ok)}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10.5px;font-weight:600;flex:none;letter-spacing:.02em}
.av.lg{width:36px;height:36px;font-size:13px}
.av.none{background:var(--hover);color:var(--fg3)}

/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--sunk);border-radius:12px;padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px;transition:.12s}
.col.hot{background:var(--sel)}
.col h3{margin:2px 4px 4px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.col h3 em{font-style:normal;color:var(--fg3);font-weight:400}
.card{background:var(--card);border-radius:9px;padding:10px 12px;box-shadow:0 0 0 .5px var(--line2),0 1px 2px rgba(0,0,0,.06);cursor:grab;display:flex;flex-direction:column;gap:6px}
.card:active{cursor:grabbing}
.card .ct1{font-weight:500}
.card .cm{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--fg3)}
.dragging{opacity:.4}

/* week schedule */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--sunk);border-radius:12px;padding:8px;min-height:260px;display:flex;flex-direction:column;gap:6px;transition:.12s}
.day.hot{background:var(--sel)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.day h4{margin:2px 4px 4px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;color:var(--fg2)}
.day h4 b{font:600 18px var(--font-d);color:var(--fg)}
.day.today h4 b{color:var(--accent)}
.chip{background:var(--card);border-radius:7px;padding:6px 8px;font-size:12px;box-shadow:0 0 0 .5px var(--line2);cursor:grab;border-left:3px solid var(--warn);display:flex;flex-direction:column;gap:2px}
.chip.working{border-left-color:var(--info)}.chip.done{border-left-color:var(--ok);opacity:.65}
.chip.start{border-left-style:dashed}
.chip span{color:var(--fg3);font-size:11px}
@media (max-width:1000px){.week{grid-template-columns:minmax(0,1fr)}.day{min-height:auto}}

/* team */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:14px}
.member{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.member .mi{flex:1;min-width:0}
.member .mi b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member .mi small{color:var(--fg3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--hover);color:var(--fg2)}
.addform{display:flex;gap:8px;flex-wrap:wrap;padding:14px;border-bottom:1px solid var(--line);align-items:center}
.addform input,.addform select{flex:1;min-width:140px}

/* forms */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;font-weight:500;color:var(--fg2)}
.inp,.f input:not([type=checkbox]),.f select,.f textarea,.addform input,.addform select{border:0;border-radius:7px;background:var(--card);box-shadow:0 0 0 .5px var(--line2),inset 0 1px 1px rgba(0,0,0,.04);padding:6px 9px;font-size:13px;outline:0;width:100%}
.f input:focus,.f select:focus,.f textarea:focus,.addform input:focus,.inp:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 40%,transparent)}
.f textarea{resize:vertical;min-height:84px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px;border-radius:7px;background:var(--card);box-shadow:0 0 0 .5px var(--line2);padding:5px 6px;cursor:text}
.chips input{border:0!important;box-shadow:none!important;flex:1;min-width:160px;padding:2px 4px!important;background:transparent!important}
.chips .c{display:inline-flex;align-items:center;gap:4px;background:var(--info-bg);color:var(--info);border-radius:999px;padding:1px 4px 1px 9px;font-size:12px}
.chips .c button{border:0;background:transparent;color:inherit;padding:0 3px;line-height:1}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.quick button{border:0;background:var(--hover);border-radius:999px;padding:2px 9px;font-size:11.5px;color:var(--fg2)}
.quick button:hover{color:var(--accent)}
.checkline{display:flex;align-items:center;gap:8px;font-size:13px}
.hint{font-size:12px;color:var(--fg3);margin:0}

/* modal (macOS sheet) */
#modal{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:60px 16px 16px}
#modal .scrim{position:absolute;inset:0;background:rgba(0,0,0,.28)}
.sheet{position:relative;background:var(--win);border-radius:12px;box-shadow:var(--shadow);width:min(620px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;animation:drop .25s cubic-bezier(.2,.8,.3,1)}
.sheet.sm{width:min(440px,100%)}
.sheet>form{display:contents}
@keyframes drop{from{transform:translateY(-24px);opacity:0}}
.sheet>header,.sheet>form>header{padding:16px 20px 6px}
.sheet>header h2,.sheet>form>header h2{margin:0;font:600 17px var(--font-d)}
.sheet>header p,.sheet>form>header p{margin:4px 0 0;color:var(--fg2);font-size:13px}
.sheet .sb{padding:12px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet>footer,.sheet>form>footer{padding:12px 20px 16px;display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}
.sheet>footer .left,.sheet>form>footer .left{margin-right:auto}
.mailbox{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:12.5px;white-space:pre-wrap;word-break:break-word;user-select:text;max-height:220px;overflow:auto;font-family:var(--mono)}

/* toasts (notification banners top-right) */
#toasts{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));z-index:60;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100% - 28px))}
.toast{background:var(--bar);backdrop-filter:blur(30px);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.22),0 0 0 .5px var(--line2);padding:11px 13px;display:flex;gap:10px;animation:slide .35s cubic-bezier(.2,.9,.3,1.15)}
@keyframes slide{from{transform:translateX(110%)}}
.toast .ti{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.toast .tb{flex:1;min-width:0}
.toast .tb small{display:block;font-size:11px;color:var(--fg3)}
.toast .tb b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast .tb p{margin:1px 0 0;font-size:12.5px;color:var(--fg2)}
.toast .ta{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}

#dropOverlay{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--accent) 18%,transparent);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
#dropOverlay div{background:var(--win);border-radius:16px;padding:28px 34px;box-shadow:var(--shadow);text-align:center;border:2px dashed var(--accent);pointer-events:none;max-width:420px}
#dropOverlay h3{margin:8px 0 4px;font:600 18px var(--font-d)}
#dropOverlay p{margin:0;color:var(--fg2)}

/* reports */
.rgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;margin-bottom:22px}
@media (max-width:1000px){.rgrid{grid-template-columns:minmax(0,1fr)}}
.chartwrap{padding:12px 14px;overflow-x:auto}
.chartwrap svg{display:block;width:100%;min-width:420px;height:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:500;color:var(--fg3);font-size:12px;padding:8px 16px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 16px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:0}
table.t td.n{text-align:right}
.tscroll{overflow-x:auto}
.bar{height:6px;border-radius:3px;background:var(--hover);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}

/* settings & about */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.setrow:last-child{border-bottom:0}
.setrow b{display:block;font-weight:500}
.setrow small{color:var(--fg3)}
.tog{position:relative;width:38px;height:22px;flex:none}
.tog input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer;position:absolute;z-index:1}
.tog span{position:absolute;inset:0;border-radius:999px;background:var(--line2);transition:.2s}
.tog span::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tog input:checked+span{background:var(--ok)}
.tog input:checked+span::after{transform:translateX(16px)}
.about{display:flex;gap:18px;align-items:center;padding:20px;flex-wrap:wrap}
.appicon{width:76px;height:76px;border-radius:18px;background:linear-gradient(160deg,#3aa0ff,#0a5fd8);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(10,95,216,.35);flex:none}
.about h3{margin:0;font:700 19px var(--font-d)}
.about p{margin:3px 0 0;color:var(--fg2)}
.about .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
a.btn{text-decoration:none;color:inherit}
.stack{display:flex;flex-direction:column;gap:22px}

.nav .short{display:none}
/* own-window mode (Windows launcher or installed app): fill the window, no fake frame */
.appwin body{padding:0;background:var(--win);background-image:none}
.appwin .win{border-radius:0;box-shadow:none;max-width:none;animation:none}
.appwin .lights{display:none}

/* reminder popup (alarm) */
.alarm{width:min(480px,100%)}
.alarm .ahead{display:flex;gap:14px;align-items:center;padding:20px 20px 8px}
.alarm .bell{width:52px;height:52px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;animation:ring 1.2s ease-in-out 2}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}}
.alarm .ahead h2{margin:0;font:700 19px var(--font-d)}
.alarm .ahead p{margin:2px 0 0;color:var(--fg2)}
.aitem{background:var(--sunk);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.aitem b{font-size:15px;font-weight:600}
.aitem .am{font-size:12.5px;color:var(--fg2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.aitem .am .over{color:var(--bad);font-weight:600}
.aitem .ab{display:flex;gap:6px;flex-wrap:wrap}
.aitem .ab select{padding:3px 6px}
.calopts{display:flex;flex-direction:column;gap:8px}
.calopt{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:10px;background:var(--sunk);border:0;text-align:left;width:100%;color:inherit;text-decoration:none}
.calopt:hover{background:var(--hover)}
.calopt.first{order:-1;box-shadow:inset 0 0 0 1.5px var(--accent)}
.calopt .ci{width:36px;height:36px;border-radius:9px;color:#fff;display:grid;place-items:center;flex:none}
.calopt b{display:block;font-weight:600}
.calopt small{display:block;color:var(--fg3);font-size:12px;line-height:1.35}
.install{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;padding:14px}
.install>div{background:var(--sunk);border-radius:10px;padding:12px 14px}
.install h4{margin:0 0 6px;font-size:13.5px}
.install ol{margin:0;padding-left:18px;color:var(--fg2);font-size:12.5px;display:flex;flex-direction:column;gap:3px}
#qr{background:#fff;padding:8px;border-radius:8px;display:inline-block;line-height:0}

/* phone: full-screen app with bottom tab bar */
@media (max-width:760px){
  body{padding:0;background:var(--bar);background-image:none}
  .win{border-radius:0;box-shadow:none;animation:none;max-width:none}
  .lights,.search,.tb-title small,.mebtn .mn,.syncchip span{display:none}
  .syncchip{padding:6px}
  .mebtn{padding:3px}
  .titlebar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));height:54px}
  .tb-title{font:700 17px var(--font-d)}
  .body{flex-direction:column}
  .side{order:2;width:auto;flex-direction:row;overflow:visible;border-right:0;border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) 4px max(6px,env(safe-area-inset-left,0px));gap:0;background:var(--bar)}
  .side h6,.side .grow,.side .credit{display:none}
  .nav{flex:1 1 0;min-width:0;flex-direction:column;gap:2px;padding:6px 2px;font-size:10.5px;color:var(--fg3);border-radius:8px}
  .nav svg{color:inherit;width:22px;height:22px}
  .nav.on{background:transparent;color:var(--accent)}
  .nav .ct,.nav .long{display:none}
  .nav .short{display:block}
  main{padding:18px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px))}
  .head h1{font-size:28px}
  .row{grid-template-columns:auto minmax(0,1fr) auto;row-gap:6px}
  .row .av{display:none}
  .rt{white-space:normal}
  select.pill{font-size:13px!important}
  .row .acts{grid-column:2/-1;justify-content:flex-start}
  .board{grid-template-columns:minmax(0,1fr)}
  input,select,textarea{font-size:16px!important}
  #modal{align-items:flex-end;padding:0}
  #modal .sheet{width:100%;border-radius:16px 16px 0 0;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .28s cubic-bezier(.2,.8,.3,1)}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function weekReport(off){
  const ws=sow(new Date());ws.setDate(ws.getDate()+off*7);const we=new Date(ws);we.setDate(we.getDate()+7);
  const all=[...S.tasks,...S.archive];const inW=s=>s&&new Date(s)>=ws&&new Date(s)<we;
  const done=all.filter(t=>inW(t.doneAt)).sort((a,b)=>new Date(a.doneAt)-new Date(b.doneAt));
  const created=all.filter(t=>inW(t.createdAt));
  const perDay=[...Array(7)].map((_,i)=>{const d=new Date(ws);d.setDate(d.getDate()+i);return{d,n:done.filter(t=>dkey(new Date(t.doneAt))===dkey(d)).length}});
  const per=S.members.map(m=>({m,done:done.filter(t=>t.assignee===m.id).length,open:S.tasks.filter(t=>t.assignee===m.id&&t.status!=='done').length})).sort((a,b)=>b.done-a.done);
  const onTime=done.filter(t=>!t.due||new Date(t.doneAt)<=D(t.due)).length;
  return{ws,we:new Date(we-1),done,created,perDay,per,onTime,email:done.filter(t=>t.source==='email').length,
    working:S.tasks.filter(t=>t.status==='working').length,pending:S.tasks.filter(t=>t.status==='pending').length,over:S.tasks.filter(isOver).length}}
function reportText(r){
  return`Digital Media Task Scheduler — Weekly Report
Week: ${fmtDay(r.ws)} – ${fmtDay(r.we)}

Issues fixed: ${r.done.length} (${r.onTime} on time)
New tasks created: ${r.created.length}
Fixed from emails: ${r.email}
Now working on: ${r.working} · Pending: ${r.pending} · Overdue: ${r.over}

By person:
${r.per.map(p=>`- ${p.m.name} (${p.m.role}): ${p.done} fixed, ${p.open} open`).join('\n')||'- No team members'}

Completed tasks:
${r.done.map(t=>`- ${t.title} — ${member(t.assignee)?.name||'Unassigned'} — ${fmtDay(new Date(t.doneAt))}`).join('\n')||'- None this week'}
`}
function chart(r){
  const W=560,H=210,L=34,B=30,T=14,R=10,max=Math.max(4,...r.perDay.map(p=>p.n));
  const step=max<=6?1:Math.ceil(max/5);const top=Math.ceil(max/step)*step;
  const y=v=>T+(H-T-B)*(1-v/top),bw=(W-L-R)/7;
  let g='';for(let v=0;v<=top;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" /><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--fg3)">${v}</text>`;
  const bars=r.perDay.map((p,i)=>{const x=L+i*bw+bw*.22,w=bw*.56,h=(H-T-B)-(y(p.n)-T);
    return`<rect x="${x}" y="${y(p.n)}" width="${w}" height="${Math.max(0,h)}" rx="5" fill="var(--accent)" opacity="${p.n?1:.0}"/>${p.n?`<text x="${x+w/2}" y="${y(p.n)-5}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--fg)">${p.n}</text>`:''}<text x="${x+w/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--fg3)">${p.d.toLocaleDateString(undefined,{weekday:'short'})}</text>`}).join('');
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Issues fixed per day">${g}${bars}</svg>`}

function render(){renderSide();const v=V[ui.view]||V.overview;const m=$('#main');const st=m.scrollTop;m.innerHTML=v();if(render.keep)m.scrollTop=st;render.keep=false;saveUi();bindView()}
function soft(){render.keep=true;render()}
function showQR(){const el=$('#qr');if(!el)return;const go=()=>{try{el.innerHTML='';new window.QRCode(el,{text:location.origin+location.pathname,width:128,height:128})}catch(e){el.remove()}};
  if(window.QRCode)go();else{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';sc.onload=go;sc.onerror=()=>el.remove();document.head.appendChild(sc)}}
function bindView(){if(ui.view==='settings'&&HOSTED)showQR();
  const at=$('#autoTog');if(at&&window.getAutostart){window.getAutostart().then(v=>{at.checked=!!v}).catch(()=>{});at.onchange=()=>window.setAutostart(at.checked).then(()=>toast({title:at.checked?'Starts with Windows':'Won’t start with Windows',icon:I.check})).catch(()=>{at.checked=!at.checked})}
  const sel=$('#dropToSel');if(sel)sel.onchange=()=>{ui.dropTo=sel.value;saveUi()};
  const pf=$('#personFilter');if(pf)pf.onchange=()=>{ui.person=pf.value;soft()};
  const am=$('#addMember');if(am)am.onsubmit=e=>{e.preventDefault();const name=$('#nm').value.trim(),email=$('#ne').value.trim();
    if(!name)return;if(email&&!validEmail(email)){toast({title:'Check the email address',msg:`“${email}” doesn't look like an email address.`});return}
    S.members.push({id:uid(),name,role:$('#nr').value,email});save();soft();toast({title:'Person added',msg:`${name} joined as ${$('#nr')?$('#nr').value:''}`.trim()})};
  const dz=$('#dropzone');if(dz){
    dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('hot')});
    dz.addEventListener('dragleave',()=>dz.classList.remove('hot'));
    dz.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();dz.classList.remove('hot');hideOverlay();handleDrop(e.dataTransfer)})}
}

function taskModal(t,prefill){
  const isNew=!t;const d=Object.assign({title:'',desc:'',assignee:'',priority:'normal',status:'pending',start:'',due:'',days:1,emails:[],popup:true,remindBefore:60},t||{},prefill||{});
  let emails=[...(d.emails||[])];
  const rb=[[0,'No early reminder'],[15,'15 minutes before'],[60,'1 hour before'],[240,'4 hours before'],[1440,'1 day before']];
  openModal(`<form id="tf"><header><h2>${isNew?(d.source==='email'?'New task from email':'New task'):'Edit task'}</h2>${d.source==='email'&&isNew?'<p>Check the details below, then save.</p>':''}</header>
   <div class="sb">
    <div class="f"><label for="t_title">Task</label><input id="t_title" required value="${esc(d.title)}" placeholder="What needs to be done?" autofocus></div>
    <div class="f"><label for="t_desc">Details</label><textarea id="t_desc" placeholder="Notes, links, file locations">${esc(d.desc)}</textarea></div>
    <div class="fgrid">
     <div class="f"><label for="t_as">Assign to</label><select id="t_as">${memberOptions(d.assignee)}</select></div>
     <div class="f"><label for="t_pr">Priority</label><select id="t_pr">${Object.entries(PRI).map(([k,v])=>`<option value="${k}" ${d.priority===k?'selected':''}>${v}</option>`).join('')}</select></div>
     <div class="f"><label for="t_st">Status</label><select id="t_st">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${d.status===k?'selected':''}>${v}</option>`).join('')}</select></div>
     <div class="f"><label for="t_days">Days needed to finish</label><input id="t_days" type="number" min="0" max="365" value="${d.days||0}"></div>
     <div class="f"><label for="t_start">Scheduled start</label><input id="t_start" type="datetime-local" value="${esc(d.start)}"></div>
     <div class="f"><label for="t_due">Deadline</label><input id="t_due" type="datetime-local" value="${esc(d.due)}"></div>
    </div>
    <div class="f"><label>Email notifications to</label><div class="chips" id="chips"></div>
     <div class="quick" id="quick"></div>
     <p class="hint">The assigned person's email is always included. Press Enter or comma after each address.</p></div>
    <div class="fgrid">
     <div class="f"><label for="t_rb">Reminder</label><select id="t_rb">${rb.map(([v,l])=>`<option value="${v}" ${+d.remindBefore===v?'selected':''}>${l}</option>`).join('')}</select></div>
     <div class="f" style="justify-content:flex-end"><label class="checkline"><input type="checkbox" id="t_pop" ${d.popup?'checked':''}> Pop up on the deadline day</label></div>
    </div>
   </div>
   <footer>${isNew?'':`<button type="button" class="btn danger left" data-act="del" data-id="${t.id}">Delete</button>`}
    <div class="left" style="display:flex;flex-direction:column;gap:4px"><label class="checkline"><input type="checkbox" id="t_cal" ${isNew&&S.settings.calOnSave!==false?'checked':''}> Add to my calendar</label><label class="checkline"><input type="checkbox" id="t_mail" ${isNew?'checked':''}> Email the team</label></div>
    <button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn primary" type="submit">${isNew?'Add task':'Save'}</button></footer></form>`);
  const chips=$('#chips'),quick=$('#quick');
  function drawChips(){chips.innerHTML=emails.map((e,i)=>`<span class="c">${esc(e)}<button type="button" data-i="${i}" aria-label="Remove ${esc(e)}">×</button></span>`).join('')+`<input id="t_em" type="email" placeholder="${emails.length?'Add another…':'name@company.com'}" aria-label="Add email">`;
    const inp=$('#t_em');
    inp.onkeydown=ev=>{if(['Enter',',',';',' '].includes(ev.key)){ev.preventDefault();addE(inp.value)}else if(ev.key==='Backspace'&&!inp.value&&emails.length){emails.pop();drawChips();$('#t_em').focus()}};
    inp.onblur=()=>{if(inp.value.trim())addE(inp.value,false)};
    inp.onpaste=ev=>{const tx=(ev.clipboardData||window.clipboardData).getData('text');if(/[,;\s]/.test(tx.trim())){ev.preventDefault();tx.split(/[,;\s]+/).forEach(x=>addE(x,false));drawChips();$('#t_em').focus()}};
    quick.innerHTML=S.members.filter(m=>m.email&&!emails.includes(m.email)).map(m=>`<button type="button" data-e="${esc(m.email)}">+ ${esc(m.name)}</button>`).join('')}
  function addE(v,refocus=true){v=v.trim().replace(/[,;]$/,'');if(!v)return;
    if(!validEmail(v)){toast({title:'Check the email address',msg:`“${v}” doesn't look like an email address.`});return}
    if(!emails.includes(v))emails.push(v);drawChips();if(refocus)$('#t_em').focus()}
  chips.onclick=ev=>{const b=ev.target.closest('button[data-i]');if(b){emails.splice(+b.dataset.i,1);drawChips()}else $('#t_em').focus()};
  quick.onclick=ev=>{const b=ev.target.closest('button[data-e]');if(b){emails.push(b.dataset.e);drawChips()}};
  drawChips();
  $('#tf').onsubmit=ev=>{ev.preventDefault();const pend=$('#t_em').value.trim();if(pend){if(!validEmail(pend)){toast({title:'Check the email address',msg:`“${pend}” doesn't look like an email address.`});return}if(!emails.includes(pend))emails.push(pend)}
    const v={title:$('#t_title').value.trim(),desc:$('#t_desc').value,assignee:$('#t_as').value,priority:$('#t_pr').value,status:$('#t_st').value,
      days:Math.max(0,parseInt($('#t_days').value)||0),start:$('#t_start').value,due:$('#t_due').value,emails,remindBefore:+$('#t_rb').value,popup:$('#t_pop').checked};
    if(!v.title)return;
    if(v.start&&v.due&&D(v.start)>D(v.due)){toast({title:'Check the dates',msg:'The scheduled start is after the deadline.'});return}
    let x;
    if(isNew){x=Object.assign({id:uid(),createdAt:new Date().toISOString(),doneAt:v.status==='done'?new Date().toISOString():'',source:d.source||'manual',n:{}},v);S.tasks.push(x)}
    else{x=t;const dueChanged=x.due!==v.due,startChanged=x.start!==v.start;
      if(v.status==='done'&&x.status!=='done')x.doneAt=new Date().toISOString();if(v.status!=='done')x.doneAt='';
      Object.assign(x,v);x.n=x.n||{};if(dueChanged){delete x.n.over;delete x.n.before;delete x.n.today}if(startChanged)delete x.n.start}
    const wantMail=$('#t_mail').checked,wantCal=$('#t_cal').checked;if(isNew)S.settings.calOnSave=wantCal;
    save();closeModal();soft();
    toast({title:isNew?'Task added':'Task saved',msg:x.title,icon:I.check});
    const mail=()=>emailTask(x,isNew?'New task assigned':'Task updated');
    if(wantCal&&(x.start||x.due))calSheet(x,wantMail?mail:null);else if(wantMail)mail()};
}

try{SYNC.sent=JSON.parse(localStorage.getItem(SYNC_KEY+'.sent'))||{}}catch(e){}

async function startSync(){

  catch(e){setSync('offline','The sync service could not load. Check the internet connection; changes are kept on this device meanwhile.');setTimeout(()=>{if(SY&&!SYNC.db)startSync()},60000);return}
  try{
    const name='dmts-'+SY.team.slice(0,8);
    const app=firebase.apps.find(a=>a.name===name)||firebase.initializeApp(SY.cfg,name);
    const db=app.firestore();
    try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
    SYNC.app=app;SYNC.db=db;SYNC.ready=false;SYNC.got={};
    const base=db.collection('teams').doc(SY.team);
    ['tasks','members'].forEach(c=>{
      SYNC.unsub.push(base.collection(c).onSnapshot({includeMetadataChanges:true},snap=>{
        applyRemote(c,snap);SYNC.got[c]=true;
        if(SYNC.got.tasks&&SYNC.got.members&&!SYNC.ready&&(!snap.metadata.fromCache||!navigator.onLine)){SYNC.ready=true;pushNow();
          if(SYNC.justJoined){SYNC.justJoined=false;render();toast({title:'Connected to your team',msg:`${S.tasks.length} tasks and ${S.members.length} people loaded.`,icon:I.check,ms:8000});if(!meM()&&S.members.length)setTimeout(()=>whoSheet(false),400)}}
        setSync(snap.metadata.fromCache?'offline':'live');

  }catch(e){setSync('error',e.message);SYNC.db=null}
}

function applyRemote(c,snap){let changed=false;
  snap.docChanges().forEach(ch=>{const d=ch.doc;if(d.metadata&&d.metadata.hasPendingWrites)return;
    const raw=d.data()||{};const {_del,_arch,_at,_by,...obj}=raw;const id=d.id;const key=c+':'+id;obj.id=id;
    if(ch.type==='removed'||_del){
      if(c==='tasks'){const b=S.tasks.length+S.archive.length;S.tasks=S.tasks.filter(t=>t.id!==id);S.archive=S.archive.filter(t=>t.id!==id);if(S.tasks.length+S.archive.length!==b)changed=true}
      else{const b=S.members.length;S.members=S.members.filter(m=>m.id!==id);if(b!==S.members.length){changed=true;S.tasks.forEach(t=>{if(t.assignee===id)t.assignee=''});if(ME===id)setMe('')}}
      SYNC.sent[key]='__del';return}
    const s=sig(c,obj,_arch);if(SYNC.sent[key]===s)return;
    if(c==='tasks'){const loc=S.tasks.find(t=>t.id===id)||S.archive.find(t=>t.id===id);
      if(loc){if(loc.n)obj.n=loc.n;if(loc.snooze)obj.snooze=loc.snooze;
        if(loc.due!==obj.due&&obj.n){delete obj.n.over;delete obj.n.before;delete obj.n.today}if(loc.start!==obj.start&&obj.n)delete obj.n.start}
      else obj.n={};
      S.tasks=S.tasks.filter(t=>t.id!==id);S.archive=S.archive.filter(t=>t.id!==id);(_arch?S.archive:S.tasks).push(obj)}
    else{const i=S.members.findIndex(m=>m.id===id);if(i>=0)S.members[i]=obj;else S.members.push(obj)}
    SYNC.sent[key]=s;changed=true});
  if(changed){saveLocal();saveSY();if($('#modal').hidden)soft();else renderSide()}}
function schedulePush(){if(!SYNC||!SYNC.ready)return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushNow,250)}
function pushNow(){if(!SYNC.ready||!SYNC.db||!SY)return;const db=SYNC.db;const base=db.collection('teams').doc(SY.team);
  const at=firebase.firestore.FieldValue.serverTimestamp();const ops=[];const seen=new Set();
  const add=(c,o,arch)=>{const key=c+':'+o.id;seen.add(key);const s=sig(c,o,arch);if(SYNC.sent[key]!==s){ops.push([c,o.id,{...(c==='tasks'?cleanTask(o):o),_arch:!!arch,_del:false,_at:at,_by:DEVICE}]);SYNC.sent[key]=s}};
  S.tasks.forEach(t=>add('tasks',t,false));S.archive.forEach(t=>add('tasks',t,true));S.members.forEach(m=>add('members',m,false));
  Object.keys(SYNC.sent).forEach(k=>{if(!seen.has(k)&&SYNC.sent[k]!=='__del'){const [c,id]=k.split(':');ops.push([c,id,{_del:true,_at:at,_by:DEVICE}]);SYNC.sent[k]='__del'}});
  if(!ops.length)return;saveSY();
  for(let i=0;i<ops.length;i+=400){const b=db.batch();
    ops.slice(i,i+400).forEach(([c,id,data])=>{const {_at,...rest}=data;const clean=JSON.parse(JSON.stringify(rest));clean._at=at;b.set(base.collection(c).doc(id),clean)});
    b.commit().catch(e=>setSync('error',/permission/i.test(e.message)?'The database refused the change. Check the security rules in Firebase.':e.message))}}

const ANDROID=/Android/i.test(navigator.userAgent);
const WINDOWS=/Windows/i.test(navigator.userAgent);
const icsUtc=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
const icsDay=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
const isoDay=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const icsEsc=s=>String(s??'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/([,;])/g,'\\$1');
function fold(line){const out=[];while(line.length>72){out.push(line.slice(0,72));line=' '+line.slice(72)}out.push(line);return out.join('\r\n')}
function evTimes(t){const st=D(t.start),due=D(t.due);if(!st&&!due)return null;
  if(st&&due&&dkey(st)!==dkey(due)){const e=sod(due);e.setDate(e.getDate()+1);return{allDay:true,s:sod(st),e}}
  if(st&&due)return{s:st,e:due>st?due:new Date(st.getTime()+30*6e4)};
  if(st)return{s:st,e:new Date(st.getTime()+60*6e4)};
  return{s:new Date(due.getTime()-30*6e4),e:due}}
function whenText(t){const st=D(t.start),due=D(t.due);return[st&&`Starts ${rel(st)}`,due&&`Due ${rel(due)}`].filter(Boolean).join(' · ')}
function calDetails(t){const m=member(t.assignee);
  return[`Assigned to: ${m?m.name+' ('+m.role+')':'Unassigned'}`,`Status: ${STATUS[t.status]} · Priority: ${PRI[t.priority]}`,
    t.start&&`Scheduled start: ${rel(D(t.start))}`,t.due&&`Deadline: ${rel(D(t.due))}`,t.days&&`Days needed: ${t.days}`,
    t.desc&&`\n${t.desc}`,'\nFrom Digital Media Task Scheduler'].filter(Boolean).join('\n')}
function vevent(t){const w=evTimes(t);if(!w)return'';const L=[];
  L.push('BEGIN:VEVENT',`UID:${t.id}@digital-media-task-scheduler`,`DTSTAMP:${icsUtc(new Date())}`,`SEQUENCE:${Math.floor(Date.now()/60000)%2000000000}`);
  if(w.allDay)L.push(`DTSTART;VALUE=DATE:${icsDay(w.s)}`,`DTEND;VALUE=DATE:${icsDay(w.e)}`);else L.push(`DTSTART:${icsUtc(w.s)}`,`DTEND:${icsUtc(w.e)}`);
  L.push(`SUMMARY:${icsEsc((t.status==='done'?'✓ ':'')+t.title)}`,`DESCRIPTION:${icsEsc(calDetails(t))}`,'CATEGORIES:Digital Media Task Scheduler',`STATUS:CONFIRMED`,`PRIORITY:${t.priority==='high'?1:t.priority==='low'?9:5}`);
  const now=new Date(),al=[];const st=D(t.start),due=D(t.due);
  if(st)al.push([st,`Starting now: ${t.title}`]);
  if(due){const rb=t.remindBefore>0?t.remindBefore:15;al.push([new Date(due-rb*6e4),`Due ${fmtTime(due)}: ${t.title}`])}
  al.filter(([d])=>d>now).forEach(([d,txt])=>L.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(txt)}`,`TRIGGER;VALUE=DATE-TIME:${icsUtc(d)}`,'END:VALARM'));
  L.push('END:VEVENT');return L.map(fold).join('\r\n')}
function icsFile(list){return['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Suhail//Digital Media Task Scheduler//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Digital Media Tasks',
  ...list.map(vevent).filter(Boolean),'END:VCALENDAR'].join('\r\n')+'\r\n'}
function googleLink(t){const w=evTimes(t);if(!w)return'';const dates=w.allDay?`${icsDay(w.s)}/${icsDay(w.e)}`:`${icsUtc(w.s)}/${icsUtc(w.e)}`;
  return`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(t.title)}&dates=${dates}&details=${encodeURIComponent(calDetails(t).slice(0,1500))}`}
function outlookLink(t,work){const w=evTimes(t);if(!w)return'';const f=d=>w.allDay?isoDay(d):d.toISOString();
  return`https://outlook.${work?'office':'live'}.com/calendar/0/action/compose?rru=addevent&subject=${encodeURIComponent(t.title)}&body=${encodeURIComponent(calDetails(t).slice(0,1500))}&startdt=${encodeURIComponent(f(w.s))}&enddt=${encodeURIComponent(f(w.e))}${w.allDay?'&allday=true':''}`}

    `<button class="calopt" data-act="calIcs"><span class="ci" style="background:#ff3b30">${I.cal}</span><span><b>Apple Calendar</b><small>iPhone, iPad and Mac. Send the event file to your phone and tap Add.</small></span></button>`:
    `<button class="calopt ${IOS?'first':''}" data-act="calIcs"><span class="ci" style="background:#ff3b30">${I.cal}</span><span><b>Apple Calendar or Outlook app</b><small>iPhone, iPad, Mac and Outlook on Windows. Includes reminders. Open the file and tap Add.</small></span></button>`;
  openModal(`<header><h2>Add to calendar</h2><p>${esc(t.title)}<br>${esc(whenText(t))}</p></header>
   <div class="sb"><div class="calopts">
    ${ics}
    <a class="calopt ${ANDROID?'first':''}" href="${esc(googleLink(t))}" target="_blank" rel="noopener"><span class="ci" style="background:#1a73e8">${I.cal}</span><span><b>Google Calendar</b><small>Android phones and Gmail. Uses your usual Google reminders.</small></span></a>
    <a class="calopt" href="${esc(outlookLink(t,false))}" target="_blank" rel="noopener"><span class="ci" style="background:#0f6cbd">${I.cal}</span><span><b>Outlook.com</b><small>Personal Outlook, Hotmail and Live accounts.</small></span></a>
    <a class="calopt" href="${esc(outlookLink(t,true))}" target="_blank" rel="noopener"><span class="ci" style="background:#5b5fc7">${I.cal}</span><span><b>Outlook for work or school</b><small>Microsoft 365 accounts.</small></span></a>
   </div><p class="hint">Calendar reminders still go off when this app is closed. If you change the task later, add it again to update the event.</p></div>
   <footer>${next?'<button class="btn left" data-act="calNext">Next: email the team</button>':''}<button class="btn primary" data-act="closeModal">Done</button></footer>`)}
function calAll(){const list=S.tasks.filter(t=>t.status!=='done'&&(t.start||t.due)&&(D(t.due)||D(t.start))>=sod(new Date()));
  if(!list.length){toast({title:'Nothing to add',msg:'No open tasks with upcoming dates.'});return}
  saveIcs(`digital-media-tasks-${dkey(new Date())}.ics`,icsFile(list));
  toast({title:`${list.length} task${list.length>1?'s':''} ready for your calendar`,msg:'Open the downloaded file to add them all.',icon:I.cal,ms:9000})}

/* ---------- email ---------- */
function mailSheet(to,subject,body){
  const href=`mailto:${to.map(encodeURIComponent).join(',')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  openModal(`<header><h2>Email notification</h2><p>Opens in your email app (such as Outlook) ready to send.</p></header>
   <div class="sb"><div class="f"><label>To</label><div class="mailbox" id="mt">${esc(to.join(', ')||'No email addresses yet. Add them to the task or person.')}</div></div>
   <div class="f"><label>Subject</label><div class="mailbox">${esc(subject)}</div></div>
   <div class="f"><label>Message</label><div class="mailbox" id="mb">${esc(body)}</div></div></div>

}
function taskRecipients(t){const m=member(t.assignee);return[...new Set([m?.email,...(t.emails||[])].filter(Boolean))]}
function emailTask(t,why='Task reminder'){const m=member(t.assignee);
  const body=`Hello${m?' '+m.name.split(' ')[0]:''},

${why}: ${t.title}

Assigned to: ${m?m.name+' ('+m.role+')':'Unassigned'}
Status: ${STATUS[t.status]}
Priority: ${PRI[t.priority]}${t.start?`\nScheduled start: ${rel(D(t.start))}`:''}${t.due?`\nDeadline: ${rel(D(t.due))}`:''}${t.days?`\nDays needed: ${t.days}`:''}${t.desc?`\n\nDetails:\n${t.desc}`:''}${evTimes(t)?`\n\nAdd to Google Calendar:\n${googleLink(t)}`:''}

— Sent from Digital Media Task Scheduler`;
  mailSheet(taskRecipients(t),`[${STATUS[t.status]}] ${t.title}${t.due?' — due '+fmtShort(D(t.due)):''}`,body)}

/* ---------- toasts & reminders ---------- */
let audioCtx=null;
function chime(){if(!S.settings.sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const t0=audioCtx.currentTime;
  [880,1320].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0+i*.12);g.gain.linearRampToValueAtTime(.12,t0+i*.12+.02);g.gain.exponentialRampToValueAtTime(.001,t0+i*.12+.5);o.connect(g).connect(audioCtx.destination);o.start(t0+i*.12);o.stop(t0+i*.12+.55)})}catch(e){}}
function toast({title,msg='',app='Digital Media Task Scheduler',icon=I.bell,actions=[],ms=6000}){
  const el=document.createElement('div');el.className='toast';
  el.innerHTML=`<div class="ti">${icon}</div><div class="tb"><small>${esc(app)} · now</small><b>${esc(title)}</b>${msg?`<p>${esc(msg)}</p>`:''}${actions.length?`<div class="ta">${actions.map((a,i)=>`<button class="btn sm ${i===0?'primary':''}" data-i="${i}">${esc(a.label)}</button>`).join('')}</div>`:''}</div><button class="ibtn" aria-label="Dismiss" style="align-self:flex-start">×</button>`;
  $('#toasts').prepend(el);let tm;const kill=()=>{el.remove()};const arm=()=>{tm=setTimeout(kill,ms)};
  el.onmouseenter=()=>clearTimeout(tm);el.onmouseleave=()=>{clearTimeout(tm);arm()};arm();setTimeout(kill,ms*3);
  el.querySelector('.ibtn').onclick=kill;
  el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{actions[+b.dataset.i].fn();kill()});
  while($('#toasts').children.length>4)$('#toasts').lastChild.remove()}
/* ---------- reminder popup (alarm) ---------- */
let alarmQ=[],alarmOpen=false,repeatT=null,flashT=null,swReg=null;const baseTitle=document.title;
const aTask=a=>a.task||task(a.id);
function sysNotify(t,msg){if(NATIVE){if(S.settings.winToast!==false&&window.nativeNotify)window.nativeNotify(String(t.title).slice(0,63),String(msg).slice(0,250)).catch(()=>{});return}if(!S.settings.system||!('Notification' in window)||Notification.permission!=='granted')return;
  const opt={body:msg,tag:t.id,icon:'icon-192.png',badge:'icon-192.png',requireInteraction:true,renotify:true};
  if(swReg&&swReg.showNotification){swReg.showNotification(t.title,opt).catch(()=>{});return}
  try{const n=new Notification(t.title,opt);n.onclick=()=>{window.focus();const x=task(t.id);if(x)taskModal(x)}}catch(e){}}
function remind(t,msg,o={}){
  const ex=alarmQ.find(a=>a.id===t.id);if(ex){ex.msg=msg;ex.missed=!!o.missed}else alarmQ.push({id:t.id,msg,missed:!!o.missed,task:o.keep?t:null});
  sysNotify(t,msg);if(NATIVE&&window.nativeAttention)window.nativeAttention().catch(()=>{});
  if(!S.settings.alarm){chime();alarmQ=[];
    toast({title:t.title,msg:`${msg}${member(t.assignee)?' · '+member(t.assignee).name:''}`,ms:15000,actions:[{label:'Open',fn:()=>taskModal(t)},{label:'Email',fn:()=>emailTask(t,'Reminder')},{label:'Mark done',fn:()=>setStatus(t,'done')}]});return}
  if(!$('#modal').hidden&&!alarmOpen){chime();toast({title:t.title,msg:msg+'. The reminder opens when you close this window.',ms:8000});return}
  showAlarm(true)}
function showAlarm(sound){
  alarmQ=alarmQ.filter(a=>{const t=aTask(a);return t&&(a.task||t.status!=='done')});
  if(!alarmQ.length){if(alarmOpen)closeModal();return}
  const n=alarmQ.length,now=new Date();
  openModal(`<div class="ahead"><div class="bell">${I.bell.replace(/16/g,'26')}</div><div><h2>${n>1?n+' reminders':'Reminder'}</h2><p>${now.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}, ${fmtTime(now)}</p></div></div>
   <div class="sb">${alarmQ.map(a=>{const t=aTask(a),m=member(t.assignee);return`<div class="aitem" data-aid="${esc(a.id)}">
    <b>${esc(t.title)}</b>
    <div class="am"><span class="${/passed|reached|overdue/i.test(a.msg)?'over':''}">${I.clock} ${esc(a.msg)}</span>${m?`<span>${esc(m.name)} · ${esc(m.role)}</span>`:''}${t.priority==='high'?'<span class="pri high">High priority</span>':''}${a.missed?'<span>Missed while the app was closed</span>':''}</div>
    <div class="ab"><button class="btn sm primary" data-act="aDone">${I.check} Mark done</button><button class="btn sm" data-act="aOpen">Open</button><button class="btn sm" data-act="aEmail">${I.mail} Email</button>
     <span style="display:inline-flex;gap:6px"><select class="sel" aria-label="Snooze for" style="width:auto"><option value="5">5 min</option><option value="10" selected>10 min</option><option value="30">30 min</option><option value="60">1 hour</option><option value="tom">Tomorrow 9 AM</option></select><button class="btn sm" data-act="aSnooze">Snooze</button></span></div></div>`}).join('')}</div>
   <footer>${n>1?'<button class="btn left" data-act="aSnoozeAll">Snooze all 10 min</button>':''}<button class="btn primary" data-act="aDismiss">${n>1?'Dismiss all':'Dismiss'}</button></footer>`,'alarm');
  alarmOpen=true;
  if(sound){chime();clearInterval(repeatT);let k=0;if(S.settings.repeat)repeatT=setInterval(()=>{if(!alarmOpen||++k>6){clearInterval(repeatT);return}chime()},20000)}
  clearInterval(flashT);let on=false;flashT=setInterval(()=>{document.title=(on=!on)?`(${alarmQ.length}) Reminder · ${aTask(alarmQ[0])?.title||''}`:baseTitle},1000)}
function stopAlarm(){alarmOpen=false;clearInterval(repeatT);clearInterval(flashT);document.title=baseTitle}
function dropAlarm(id){alarmQ=alarmQ.filter(a=>a.id!==id)}
function snooze(t,v){let until;if(v==='tom'){const d=new Date();d.setDate(d.getDate()+1);d.setHours(9,0,0,0);until=d}else until=new Date(Date.now()+(+v)*6e4);
  if(task(t.id)){t.snooze=until.toISOString();save()}toast({title:'Snoozed',msg:`${t.title} · until ${rel(until)}`,icon:I.clock})}
function alarmAction(act,el){const box=el.closest('[data-aid]');const a=box&&alarmQ.find(x=>x.id===box.dataset.aid);const t=a&&aTask(a);
  if(act==='aDismiss'){closeModal();return}
  if(act==='aSnoozeAll'){alarmQ.forEach(x=>{const tt=aTask(x);if(tt)snooze(tt,10)});closeModal();return}
  if(!t)return;dropAlarm(a.id);
  if(act==='aDone'){if(task(t.id))setStatus(t,'done');if(alarmQ.length)showAlarm(false);else closeModal();return}
  if(act==='aSnooze'){snooze(t,box.querySelector('select').value);if(alarmQ.length)showAlarm(false);else closeModal();return}
  stopAlarm();
  if(act==='aOpen'){if(task(t.id))taskModal(t);else closeModal()}
  if(act==='aEmail')emailTask(t,'Reminder')}

function tick(){const R=(t,m,o)=>{if(inScope(t))remind(t,m,o)};const now=new Date(),tk=dkey(now);let ch=false;const fresh=d=>now-d<10*6e4;const H=36e5;
  for(const t of S.tasks){if(t.status==='done')continue;t.n=t.n||{};const due=D(t.due),st=D(t.start);
    if(t.snooze&&now>=new Date(t.snooze)){delete t.snooze;ch=true;R(t,due?(now<due?`Snoozed reminder · due ${rel(due)}`:`Snoozed reminder · deadline passed ${rel(due)}`):'Snoozed reminder');continue}
    if(st&&now>=st&&!t.n.start){t.n.start=1;ch=true;if(fresh(st))R(t,'Scheduled to start now');else if(now-st<12*H)R(t,`Was scheduled to start ${rel(st)}`,{missed:true})}
    if(due&&t.remindBefore>0&&now<due&&now>=due-t.remindBefore*6e4&&!t.n.before){t.n.before=1;if(dkey(due)===tk)t.n.today=tk;ch=true;R(t,`Due ${rel(due)}`)}
    if(due&&t.popup&&dkey(due)===tk&&now<due&&t.n.today!==tk){t.n.today=tk;ch=true;R(t,`Due today at ${fmtTime(due)}`)}
    if(due&&now>=due&&!t.n.over){t.n.over=1;ch=true;if(fresh(due))R(t,'Deadline reached');else if(now-due<3*24*H)R(t,`Deadline passed ${rel(due)}`,{missed:true})}}
  $('#clock').textContent=now.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+'  '+fmtTime(now);
  if(ch){save();if($('#modal').hidden)soft();else renderSide()}}
function dailyPopup(){const tk=dkey(new Date());if(!S.settings.popup||S.lastPopup===tk)return;if(!$('#modal').hidden){setTimeout(dailyPopup,4000);return}
  const list=S.tasks.filter(t=>t.status!=='done'&&inScope(t)&&(isToday(t)||isOver(t))).sort((a,b)=>D(a.due)-D(b.due));
  S.lastPopup=tk;list.forEach(t=>{t.n=t.n||{};if(isToday(t))t.n.today=tk});save();if(!list.length)return;
  openModal(`<header><h2>${list.length} task${list.length>1?'s':''} to finish today</h2><p>Deadlines for ${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}, including anything overdue.</p></header>
   <div class="sb" style="padding:0"><div class="list">${list.map(row).join('')}</div></div>
   <footer><button class="btn" data-act="closeModal">Later</button><button class="btn primary" data-act="closeModal">Got it</button></footer>`)}

/* ---------- actions ---------- */
function setStatus(t,s){if(!t)return;if(s==='done'&&t.status!=='done')t.doneAt=new Date().toISOString();if(s!=='done')t.doneAt='';t.status=s;save();soft();
  if(s==='done')toast({title:'Task done',msg:t.title,icon:I.check,actions:[{label:'Remove from list',fn:()=>archiveTask(t)},{label:'Undo',fn:()=>setStatus(t,'pending')}]})}
function archiveTask(t){S.tasks=S.tasks.filter(x=>x!==t);S.archive.push(t);save();soft()}
function delTask(t){confirmBox('Delete this task?',`“${t.title}” will be deleted and won't appear in reports.`,'Delete',()=>{S.tasks=S.tasks.filter(x=>x!==t);save();closeModal();soft();toast({title:'Task deleted',msg:t.title,icon:I.trash})})}
async function copy(text,ok='Copied'){try{await navigator.clipboard.writeText(text);toast({title:ok,icon:I.check})}catch(e){
  openModal(`<header><h2>Copy this text</h2><p>Select all and copy with Ctrl+C.</p></header><div class="sb"><textarea class="inp" id="cpta" style="min-height:240px;font-family:var(--mono);font-size:12px">${esc(text)}</textarea></div><footer><button class="btn primary" data-act="closeModal">Done</button></footer>`);
  setTimeout(()=>{const a=$('#cpta');a&&a.select()},50)}}
function download(name,text,type){if(NATIVE&&window.saveFile){window.saveFile(name,text).then(p=>toast({title:'Saved to Downloads',msg:p,icon:I.check})).catch(()=>copy(text));return}
try{const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){copy(text)}}

document.addEventListener('click',e=>{

  const id=el.dataset.id||el.closest('[data-id]')?.dataset.id;const t=id&&task(id);
  const mid=el.closest('[data-mid]')?.dataset.mid;
  if(el.tagName==='SELECT')return;
  switch(act){
    case'nav':closeModal();ui.view=el.dataset.view;render();$('#main').scrollTop=0;break;
    case'new':taskModal(null,ui.view==='schedule'?{due:at(1,17)}:{due:at(0,17)});break;
    case'edit':if(t)taskModal(t);break;
    case'toggle':setStatus(t,t.status==='done'?'pending':'done');break;
    case'del':if(t)delTask(t);break;

    case'email':if(t)emailTask(t,'Task reminder');break;
    case'closeModal':closeModal();break;
    case'cal':if(t)calSheet(t);break;
    case'setupSync':syncSetupSheet();break;
    case'joinSync':joinSheet('');break;
    case'invite':inviteSheet();break;
    case'leaveSync':leaveSync();break;
    case'who':if(!S.members.length)setupSheet();else whoSheet(false);break;
    case'setup':setupSheet();break;
    case'restoreFirst':closeModal();ui.view='settings';render();boot();setTimeout(()=>{const b=$('[data-act=pasteBackup]');b&&b.scrollIntoView({block:'center'})},100);break;
    case'pickMe':{setMe(el.dataset.m);const m=meM();closeModal();soft();toast({title:m?`Hi ${firstName(m)}`:'Shared device',msg:m?`This device now shows ${m.role==='Admin'||m.role==='Manager'?'the team’s tasks and reminds you about '+(scope()==='all'?'everyone’s':'your')+' tasks':'your tasks and reminders'}.`:'Showing and reminding about everyone’s tasks.',icon:I.check});break}
    case'calIcs':if(calCtx){saveIcs(`${calCtx.t.title.replace(/[^\w\- ]+/g,'').trim().slice(0,50)||'task'}.ics`,icsFile([calCtx.t]));toast({title:'Calendar event ready',msg:IOS?'Tap Add to Calendar.':NATIVE?'Your calendar app opens with the event. Click Save.':WINDOWS?'Open the file from the Downloads list (top right), then choose Save in Calendar or Outlook.':'Open the downloaded file to add it.',icon:I.cal,ms:10000})}break;

    case'editMember':{const m=member(mid);if(m)memberModal(m);break}

    case'csv':{const all=[...S.tasks,...S.archive];const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
      download(`task-report-${dkey(new Date())}.csv`,['Task,Assigned to,Role,Status,Priority,Scheduled start,Deadline,Days needed,Finished,Source',...all.map(t=>{const m=member(t.assignee);return[t.title,m?.name,m?.role,STATUS[t.status],PRI[t.priority],t.start,t.due,t.days,t.doneAt?new Date(t.doneAt).toLocaleString():'',t.source].map(q).join(',')})].join('\r\n'),'text/csv');break}

    case'testNotif':remind({id:'test',title:'Export final cut for client review',assignee:S.members[0]?.id,status:'pending',priority:'normal',emails:[]},'Due today at 5:00 PM',{keep:true});break;

    case'contact':mailSheet(['sikunju@outlook.com'],'Digital Media Task Scheduler','Hi Suhail,\n\n');break;
    case'pickEmail':$('#emailFile').click();break;
    case'pasteEmail':pasteModal();break;
  }
});
if(NATIVE)document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;const h=a.getAttribute('href')||'';
  if(/^(https?:|mailto:)/i.test(h)&&window.openExternal){e.preventDefault();e.stopPropagation();window.openExternal(a.href);if(a.id==='openMail')setTimeout(closeModal,300)}},true);
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches('select[data-act=status]')){const t=task(el.closest('[data-id]').dataset.id);setStatus(t,el.value)}
  if(el.matches('input[data-set]')){S.settings[el.dataset.set]=el.checked;save()}
  if(el.id==='scopeSel'){setScope(el.value);soft()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'&&$('#modal').hidden){e.preventDefault();taskModal(null,{due:at(0,17)})}});
$('#q').addEventListener('input',e=>{ui.q=e.target.value;if(ui.view!=='tasks'){ui.view='tasks';render();$('#q').focus()}else soft()});
function restore(text){let s;try{s=JSON.parse(text.trim());if(!Array.isArray(s.tasks)||!Array.isArray(s.members))throw 0}catch(err){toast({title:"That isn't a backup",msg:'Use the text from Copy backup or a .json file saved from this app.'});return}
  confirmBox('Restore this backup?',`${s.tasks.length} tasks and ${s.members.length} people will replace what's here now${SY?', on every synced device':''}.`,'Restore',()=>{S=Object.assign({archive:[],settings:{}},s);S.settings=Object.assign({sound:true,system:false,popup:true,alarm:true,repeat:true},S.settings);save();if(ME&&!member(ME))setMe('');render();toast({title:'Backup restored',icon:I.check});if(!meM()&&S.members.length>1)setTimeout(()=>whoSheet(false),300)},false)}
$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f)restore(await f.text())});
$('#emailFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f)fromEmailFile(f)});

/* ---------- drag & drop: tasks ---------- */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[draggable=true][data-id]');if(!c)return;dragId=c.dataset.id;c.classList.add('dragging');
  try{e.dataTransfer.setData('text/x-task',dragId);e.dataTransfer.effectAllowed='move'}catch(err){}});
document.addEventListener('dragend',e=>{dragId=null;$$('.dragging').forEach(x=>x.classList.remove('dragging'));$$('.hot').forEach(x=>x.classList.remove('hot'))});
document.addEventListener('dragover',e=>{
  if(dragId){const z=e.target.closest('[data-drop-status],[data-drop-day]');$$('.col.hot,.day.hot').forEach(x=>{if(x!==z)x.classList.remove('hot')});if(z){e.preventDefault();z.classList.add('hot')}return}
  if(isExternal(e)){e.preventDefault();if(!e.target.closest('#dropzone'))showOverlay()}});
document.addEventListener('drop',e=>{
  if(dragId){const z=e.target.closest('[data-drop-status],[data-drop-day]');const t=task(dragId);dragId=null;if(!z||!t)return;e.preventDefault();
    if(z.dataset.dropStatus){setStatus(t,z.dataset.dropStatus)}
    else{const [y,mo,da]=z.dataset.dropDay.split('-').map(Number);const old=D(t.due)||(()=>{const x=new Date();x.setHours(17,0,0,0);return x})();
      const nd=new Date(old);nd.setFullYear(y,mo-1,da);
      if(t.start){const st=D(t.start);const shift=nd-old;const ns=new Date(st.getTime()+shift);t.start=toInput(ns)}
      t.due=toInput(nd);t.n=t.n||{};delete t.n.over;delete t.n.before;delete t.n.today;save();soft();toast({title:'Rescheduled',msg:`${t.title} → ${fmtDay(nd)}`,icon:I.cal,ms:9000,actions:[{label:'Update calendar',fn:()=>calSheet(t)}]})}
    return}
  if(isExternal(e)){e.preventDefault();hideOverlay();handleDrop(e.dataTransfer)}});
function isExternal(e){const ty=Array.from(e.dataTransfer?.types||[]);return ty.includes('Files')||(ty.includes('text/plain')&&!ty.includes('text/x-task'))}
let ovT;
function showOverlay(){const o=$('#dropOverlay');const m=member(ui.dropTo)||S.members[0];$('#dropTo').textContent=m?`It will be assigned to ${m.name}. You can change this before saving.`:'You can choose who it goes to before saving.';o.hidden=false;clearTimeout(ovT);ovT=setTimeout(hideOverlay,700)}
function hideOverlay(){$('#dropOverlay').hidden=true}
document.addEventListener('dragover',()=>{if(!$('#dropOverlay').hidden){clearTimeout(ovT);ovT=setTimeout(hideOverlay,700)}});

/* ---------- email parsing ---------- */
function handleDrop(dt){if(!dt)return;
  const f=dt.files&&dt.files[0];if(f){fromEmailFile(f);return}
  const txt=dt.getData('text/plain');if(txt)fromText(txt);}
async function fromEmailFile(f){const name=f.name||'email';
  try{
    if(/\.msg$/i.test(name)){const buf=await f.arrayBuffer();emailToTask(parseMsg(buf,name));return}
    const text=await f.text();
    if(/\.eml$/i.test(name)||/^(received|from|subject|date|mime-version|return-path|delivered-to|message-id|to):/im.test(text.slice(0,4000)))emailToTask(parseEml(text));
    else fromText(text,name.replace(/\.[^.]+$/,''));
  }catch(err){toast({title:"Couldn't read that file",msg:'Drop an email saved as .eml or .msg, or paste the email text instead.'})}}
function fromText(txt,fallback){const lines=txt.replace(/\r/g,'').split('\n');
  const sub=(txt.match(/^subject:\s*(.+)$/im)||[])[1];const from=(txt.match(/^from:\s*(.+)$/im)||[])[1];
  const title=(sub||lines.find(l=>l.trim())||fallback||'Task from email').trim().slice(0,140);
  emailToTask({subject:title,from:from||'',date:'',body:txt.trim()})}
function decodeWords(s){return s.replace(/=\?([^?]+)\?([BQbq])\?([^?]*)\?=/g,(m,cs,enc,data)=>{try{
  const bytes=enc.toUpperCase()==='B'?Uint8Array.from(atob(data),c=>c.charCodeAt(0)):qpBytes(data.replace(/_/g,' '));
  return new TextDecoder(cs.toLowerCase()).decode(bytes)}catch(e){return data}}).replace(/\?=\s+=\?/g,'')}
function qpBytes(s){const out=[];s=s.replace(/=\r?\n/g,'');for(let i=0;i<s.length;i++){if(s[i]==='='&&/^[0-9A-F]{2}$/i.test(s.substr(i+1,2))){out.push(parseInt(s.substr(i+1,2),16));i+=2}else out.push(s.charCodeAt(i)&255)}return Uint8Array.from(out)}
function splitPart(raw){const m=raw.match(/\r?\n\r?\n/);if(!m)return{head:raw,body:''};return{head:raw.slice(0,m.index).replace(/\r?\n[ \t]+/g,' '),body:raw.slice(m.index+m[0].length)}}
const hdr=(head,k)=>{const m=head.match(new RegExp('^'+k+':[ \\t]*(.*)$','im'));return m?m[1].trim():''};
function partText(raw){const {head,body}=splitPart(raw);const ct=hdr(head,'content-type').toLowerCase()||'text/plain';
  const b=ct.match(/boundary="?([^";]+)"?/i);
  if(ct.startsWith('multipart/')&&b){const parts=body.split('--'+b[1]).slice(1).filter(p=>!p.startsWith('--'));
    let html='';for(const p of parts){const r=partText(p.replace(/^\r?\n/,''));if(r.type==='plain'&&r.text.trim())return r;if(r.type==='html'&&!html)html=r.text}
    return{type:'plain',text:html}}
  if(!ct.startsWith('text/'))return{type:'other',text:''};
  const cs=(ct.match(/charset="?([^";]+)"?/)||[])[1]||'utf-8';const te=hdr(head,'content-transfer-encoding').toLowerCase();
  let bytes;if(te==='base64'){bytes=Uint8Array.from(atob(body.replace(/\s+/g,'')),c=>c.charCodeAt(0))}else if(te==='quoted-printable'){bytes=qpBytes(body)}else bytes=null;
  let text;try{text=bytes?new TextDecoder(cs).decode(bytes):body}catch(e){text=bytes?new TextDecoder().decode(bytes):body}
  if(ct.startsWith('text/html')){const d=new DOMParser().parseFromString(text,'text/html');d.querySelectorAll('style,script').forEach(x=>x.remove());return{type:'html',text:(d.body?.innerText||d.body?.textContent||'').replace(/\n{3,}/g,'\n\n')}}
  return{type:'plain',text}}
function parseEml(text){const {head}=splitPart(text);
  return{subject:decodeWords(hdr(head,'subject')),from:decodeWords(hdr(head,'from')),date:hdr(head,'date'),body:partText(text).text.trim()}}
function parseMsg(buf,name){const u8=new Uint8Array(buf);
  const utf16=new TextDecoder('utf-16le').decode(u8.subarray(0,u8.length-(u8.length%2)));
  const latin=new TextDecoder('latin1').decode(u8);
  const strs=(utf16.match(/[\x20-\x7E -ɏ؀-ۿ\r\n\t]{6,}/g)||[]).map(s=>s.trim()).filter(s=>s.length>5);
  const from=(latin.match(/[\w.+-]+@[\w-]+\.[\w.-]+/)||utf16.match(/[\w.+-]+@[\w-]+\.[\w.-]+/)||[''])[0];
  const body=strs.filter(s=>/\s/.test(s)&&!/^(IPM\.|Microsoft|SMTP|EX|\/O=)/.test(s)).sort((a,b)=>b.length-a.length)[0]||'';
  return{subject:name.replace(/\.msg$/i,''),from,date:'',body:body.slice(0,3000)}}
function emailToTask(m){
  const body=(m.body||'').replace(/\n{3,}/g,'\n\n').slice(0,3500);
  const desc=[m.from&&`From: ${m.from}`,m.date&&`Received: ${m.date}`].filter(Boolean).join('\n')+(body?`\n\n${body}`:'');
  const subj=(m.subject||'').replace(/^((re|fw|fwd)\s*:\s*)+/i,'').trim()||'Task from email';
  taskModal(null,{title:subj,desc:desc.trim(),assignee:ui.dropTo||'',source:'email',due:at(1,17),days:1,priority:/urgent|asap|important/i.test(subj+body.slice(0,300))?'high':'normal'})}
function pasteModal(){openModal(`<header><h2>Paste email text</h2><p>Paste the whole email. The subject or first line becomes the task title.</p></header>
  <div class="sb"><div class="f"><label for="pe">Email</label><textarea id="pe" style="min-height:200px" autofocus placeholder="Subject: Logo looks blurry on the homepage video&#10;From: client@example.com&#10;&#10;Hi team…"></textarea></div>
  <div class="f"><label for="peTo">Assign to</label><select id="peTo">${memberOptions(ui.dropTo)}</select></div></div>
  <footer><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" id="peGo">Create task</button></footer>`,'sm');
  $('#peGo').onclick=()=>{const v=$('#pe').value.trim();if(!v){$('#pe').focus();return}ui.dropTo=$('#peTo').value;closeModal();fromText(v)}}
document.addEventListener('paste',e=>{if(ui.view!=='overview'||!$('#modal').hidden)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  const tx=e.clipboardData?.getData('text');if(tx&&tx.trim().length>3){e.preventDefault();fromText(tx)}});

/* ---------- start ---------- */
if('serviceWorker' in navigator&&HOSTED){navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(r=>{swReg=r}).catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{const x=e.data&&task(e.data.open);if(x)taskModal(x)})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
window.addEventListener('focus',()=>tick());
let booted=false;function boot(){if(booted)return;booted=true;if(SY)startSync();tick();setInterval(tick,15000);setTimeout(dailyPopup,600)}
if(ME&&!member(ME))setMe('');
renderLogo();render();if(!S.members.length){boot();if(!/^#join=/.test(location.hash)&&!SY)setTimeout(setupSheet,350)}else if(needWho())setTimeout(()=>whoSheet(true),400);else boot();
try{if(/^#join=/.test(location.hash)){const c=location.hash.slice(6);history.replaceState(null,'',location.pathname+location.search);setTimeout(()=>{if(!$('#modal').hidden)closeModal();joinSheet(c)},700)}}catch(e){}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SY&&!SYNC.db)startSync()});
window.addEventListener('online',()=>{if(SY&&!SYNC.db)startSync()});
try{const qt=new URLSearchParams(location.search).get('task');if(qt&&task(qt))setTimeout(()=>taskModal(task(qt)),900)}catch(e){}
})();
</script>
